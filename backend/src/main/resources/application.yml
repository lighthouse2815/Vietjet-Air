server:
  port: ${SERVER_PORT:8085}
  error:
    include-message: never
    include-stacktrace: never
spring:
  application:
    name: independent-flight-demo
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5438/flight_demo}
    username: ${POSTGRES_USER:flight_demo}
    password: ${POSTGRES_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  jackson:
    time-zone: Asia/Ho_Chi_Minh
app:
  frontend-origin: ${FRONTEND_ORIGIN:http://localhost:5173}
  jwt-secret: ${JWT_SECRET}
  hold-minutes: ${HOLD_MINUTES:15}
  check-in-open-hours: ${CHECK_IN_OPEN_HOURS:720}
  check-in-close-hours: ${CHECK_IN_CLOSE_HOURS:1}
  seed-days: ${SEED_DAYS:90}
  admin-email: ${ADMIN_EMAIL:}
  admin-password: ${ADMIN_PASSWORD:}
