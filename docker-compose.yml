name: vietjet-independent-demo
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: flight_demo
      POSTGRES_USER: ${POSTGRES_USER:-flight_demo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5438}:5432"
    volumes:
      - flight_demo_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d flight_demo"]
      interval: 5s
      timeout: 5s
      retries: 12
volumes:
  flight_demo_data:
